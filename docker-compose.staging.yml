# Docker Compose cho môi trường Staging / Demo dự án QLLH
#
# Bao gồm:
# - mysql: MySQL 8.4 (utf8mb4, collation chuẩn theo ADR-003)
# - backend: Laravel REST API (PHP 8.2+ / PHP-FPM)
# - frontend: Nginx phục vụ Angular SPA và reverse-proxy /api sang backend
#
# Cách chạy:
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Dừng và xóa:
#   docker compose -f docker-compose.staging.yml down

services:
  mysql:
    image: mysql:8.4
    container_name: qllh-staging-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-QLLopHoc}
      MYSQL_USER: ${DB_USERNAME:-qllh_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-require-primary-key=ON
    volumes:
      - mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qllh-staging-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:QUhk4M4w+U3sw2qCTEKHRhw+EeGQHUGwpGoi2oku8VM=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-QLLopHoc}
      DB_USERNAME: ${DB_USERNAME:-qllh_user}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: nginx:alpine
    container_name: qllh-staging-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_staging_data:
    driver: local

