openapi: 3.1.0
info:
  title: QLLH API — Hệ thống quản lý lớp học
  version: 0.1.0
  description: |
    Hợp đồng API giữa Laravel (backend) và Angular (frontend).

    Nguồn chân lý là `docs/04-api-contract.md`. File này là khung ban đầu (Tuần 1),
    được bổ sung dần mỗi khi thêm module. Mọi endpoint đều bọc trong envelope thống nhất.

    **Auth:** Sanctum personal access token, gửi qua `Authorization: Bearer <token>`, hạn 7 ngày (ADR-004).
servers:
  - url: http://localhost:8000/api
    description: Môi trường local

# Mọi endpoint đều yêu cầu Bearer token, trừ `/auth/login` (khai `security: []` tại chỗ).
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Đăng nhập, đăng xuất, hồ sơ cá nhân
  - name: Options
    description: Dữ liệu gọn cho ô chọn (dropdown) phía FE
  - name: Sinh viên
    description: Hồ sơ sinh viên và tài khoản đi kèm
  - name: Giảng viên
    description: Hồ sơ giảng viên và tài khoản đi kèm
  - name: Lớp hành chính
    description: Lớp quản lý theo khóa/ngành và việc gán sinh viên vào lớp
  - name: Môn học
    description: Dữ liệu môn học
  - name: Học kỳ
    description: Học kỳ và vòng đời trạng thái (BR-24, BR-25)
  - name: Phòng học
    description: Phòng học và sức chứa
  - name: Menu
    description: Menu động theo vai trò (SCR-47)
  - name: Cấu hình
    description: Tham số hệ thống dạng khoá–giá trị, gồm bảng quy đổi điểm

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, trả token Sanctum
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              oneOf:
                - required: [email]
                - required: [ma_sv]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                  description: Dùng cho tài khoản ADMIN hoặc giảng viên.
                ma_sv:
                  type: string
                  maxLength: 50
                  example: SV2026001
                  description: Dùng cho tài khoản sinh viên.
                password:
                  type: string
                  example: password
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DuLieuDangNhap"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "429":
          $ref: "#/components/responses/Loi429"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Thu hồi token hiện tại
      responses:
        "204":
          description: Đã đăng xuất
        "401":
          $ref: "#/components/responses/Loi401"

  /auth/me:
    get:
      tags: [Auth]
      summary: Thông tin người dùng đang đăng nhập
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThanhCong"
        "401":
          $ref: "#/components/responses/Loi401"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Đổi mật khẩu (bắt buộc ở lần đăng nhập đầu)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mat_khau_cu, password, password_confirmation]
              properties:
                mat_khau_cu:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        "200":
          description: Đổi mật khẩu thành công
        "422":
          $ref: "#/components/responses/Loi422"
        "401":
          $ref: "#/components/responses/Loi401"

  /me/avatar:
    post:
      tags: [Auth]
      summary: Tải ảnh đại diện lên Cloudinary (FR-01.10)
      description: |
        Multipart, field `anh`. JPEG/PNG/WebP/GIF, tối đa 5 MB. Ảnh được cắt
        vuông 512×512. Thay ảnh thì ảnh cũ bị xóa trên Cloudinary (ADR-019).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [anh]
              properties:
                anh:
                  type: string
                  format: binary
      responses:
        "200":
          description: Cập nhật ảnh đại diện thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NguoiDung"
        "422":
          $ref: "#/components/responses/Loi422"
        "401":
          $ref: "#/components/responses/Loi401"
        "502":
          $ref: "#/components/responses/Loi502"
        "503":
          $ref: "#/components/responses/Loi503"
    delete:
      tags: [Auth]
      summary: Gỡ ảnh đại diện (FR-01.11)
      description: Xóa ảnh trên Cloudinary và đặt `avatar_url = null`.
      responses:
        "200":
          description: Đã gỡ ảnh đại diện
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NguoiDung"
        "401":
          $ref: "#/components/responses/Loi401"

  /options/subjects:
    get:
      tags: [Options]
      summary: Danh sách môn học cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OptionMonHoc"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /options/semesters:
    get:
      tags: [Options]
      summary: Danh sách học kỳ cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OptionHocKy"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /options/teachers:
    get:
      tags: [Options]
      summary: Danh sách giảng viên cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Option"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /options/rooms:
    get:
      tags: [Options]
      summary: Danh sách phòng học cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OptionPhongHoc"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /options/admin-classes:
    get:
      tags: [Options]
      summary: Danh sách lớp hành chính cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OptionLopHanhChinh"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /options/sections:
    get:
      tags: [Options]
      summary: Danh sách lớp học phần đang mở cho ô chọn
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/OptionLopHocPhan"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"

  /students:
    get:
      tags: [Sinh viên]
      summary: Danh sách sinh viên (ADMIN; TEACHER chỉ lớp mình phụ trách)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: lop_hanh_chinh_id
          in: query
          schema:
            type: integer
        - name: khoa_hoc
          in: query
          description: Lọc theo khóa của lớp hành chính.
          schema:
            type: string
        - name: gioi_tinh
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/TrangThaiLoc"
        - name: ngay_sinh_tu
          in: query
          schema:
            type: string
            example: "2000-01-01"
        - name: ngay_sinh_den
          in: query
          schema:
            type: string
            example: "2010-12-31"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - $ref: "#/components/schemas/PhanTrang"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SinhVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
    post:
      tags: [Sinh viên]
      summary: Tạo sinh viên kèm tài khoản (ADMIN)
      description: Mật khẩu ban đầu ngẫu nhiên 12 ký tự, trả **một lần** trong `mat_khau_ban_dau` và bắt đổi ở lần đăng nhập đầu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinhVienInput"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SinhVienTaoMoi"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /students/bulk-status:
    patch:
      tags: [Sinh viên]
      summary: Khóa/mở nhiều sinh viên (ADMIN) — BR-30, BR-31
      description: Khóa thì khóa luôn tài khoản và **thu hồi toàn bộ token** (BR-30). Luôn trả 200, đọc `chi_tiet` để biết dòng nào hỏng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStatusInput"
      responses:
        "200":
          description: Đã xử lý từng bản ghi độc lập
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkKetQua"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /students/bulk-delete:
    post:
      tags: [Sinh viên]
      summary: Xóa mềm nhiều sinh viên (ADMIN) — BR-31
      description: Từng bản ghi áp điều kiện FR-02.06; dòng còn đăng ký ACTIVE bị từ chối riêng với `DELETE_BLOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: Đã xử lý từng bản ghi độc lập
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkKetQua"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /students/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Sinh viên]
      summary: Chi tiết sinh viên
      description: ADMIN xem mọi hồ sơ; TEACHER chỉ sinh viên thuộc lớp mình; STUDENT chỉ bản thân.
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SinhVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
    put:
      tags: [Sinh viên]
      summary: Cập nhật sinh viên (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SinhVienInput"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SinhVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "422":
          $ref: "#/components/responses/Loi422"
    delete:
      tags: [Sinh viên]
      summary: Xóa mềm sinh viên (ADMIN)
      responses:
        "200":
          description: Đã xóa — envelope có `data = null`, không dùng 204
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThanhCong"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "409":
          $ref: "#/components/responses/Loi409"

  /students/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Sinh viên]
      summary: Khóa/mở một sinh viên (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai]
              properties:
                trang_thai:
                  type: boolean
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SinhVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"

  /teachers:
    get:
      tags: [Giảng viên]
      summary: Danh sách giảng viên (mọi vai trò, chỉ xem)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: chuyen_mon
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/TrangThaiLoc"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - $ref: "#/components/schemas/PhanTrang"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/GiangVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
    post:
      tags: [Giảng viên]
      summary: Tạo giảng viên kèm tài khoản (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiangVienInput"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GiangVienTaoMoi"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /teachers/bulk-status:
    patch:
      tags: [Giảng viên]
      summary: Khóa/mở nhiều giảng viên (ADMIN) — BR-30, BR-31
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStatusInput"
      responses:
        "200":
          description: Đã xử lý từng bản ghi độc lập
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkKetQua"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /teachers/bulk-delete:
    post:
      tags: [Giảng viên]
      summary: Xóa mềm nhiều giảng viên (ADMIN) — BR-31
      description: Từng bản ghi áp điều kiện FR-04.05.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: Đã xử lý từng bản ghi độc lập
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkKetQua"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /teachers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Giảng viên]
      summary: Chi tiết giảng viên
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GiangVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
    put:
      tags: [Giảng viên]
      summary: Cập nhật giảng viên
      description: ADMIN sửa mọi trường; TEACHER chỉ sửa `so_dien_thoai` của bản thân.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiangVienInput"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GiangVien"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "422":
          $ref: "#/components/responses/Loi422"
    delete:
      tags: [Giảng viên]
      summary: Xóa mềm giảng viên (ADMIN)
      responses:
        "200":
          description: Đã xóa — `data = null`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThanhCong"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "409":
          $ref: "#/components/responses/Loi409"

  /teachers/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Giảng viên]
      summary: Khóa/mở một giảng viên (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
