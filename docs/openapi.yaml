            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PhongHoc"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "422":
          $ref: "#/components/responses/Loi422"
    delete:
      tags: [Phòng học]
      summary: Xóa mềm phòng học (ADMIN)
      responses:
        "200":
          description: Đã xóa — `data = null`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThanhCong"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "409":
          $ref: "#/components/responses/Loi409"

  /rooms/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Phòng học]
      summary: Khóa/mở một phòng học (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai]
              properties:
                trang_thai:
                  type: boolean
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PhongHoc"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"

  /menus:
    get:
      tags: [Menu]
      summary: Danh sách menu — tự lọc theo vai trò người gọi
      description: Trả mục đang bật (`trang_thai = true`) mà `vai_tro` bằng null hoặc đúng vai trò người gọi. Không phân trang — menu là danh sách ngắn.
      parameters:
        - name: vi_tri
          in: query
          schema:
            type: string
            enum: [header, sidebar]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Loi401"
    post:
      tags: [Menu]
      summary: Tạo menu (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuInput"
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

  /menus/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Menu]
      summary: Chi tiết menu (ADMIN)
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
    put:
      tags: [Menu]
      summary: Cập nhật menu (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuInput"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"
        "422":
          $ref: "#/components/responses/Loi422"
    delete:
      tags: [Menu]
      summary: Xóa mềm menu (ADMIN)
      responses:
        "200":
          description: Đã xóa — `data = null`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThanhCong"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "404":
          $ref: "#/components/responses/Loi404"

  /settings:
    get:
      tags: [Cấu hình]
      summary: Đọc cấu hình hệ thống (ADMIN)
      description: Trả object khoá → giá trị, gồm `diem.trong_so`, `diem.bang_quy_doi`, `diem.diem_danh.sua_trong_so_ngay`.
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BanCauHinh"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
    put:
      tags: [Cấu hình]
      summary: Ghi cấu hình hệ thống (ADMIN)
      description: Ghi từng khoá gửi lên, khoá không gửi giữ nguyên. `diem.bang_quy_doi` bị 422 nếu khoảng chồng lấn, không phủ kín 0–10, hoặc `chu` ngoài A/B/C/D/F.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CauHinhInput"
      responses:
        "200":
          description: Đã ghi cấu hình
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ThanhCong"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BanCauHinh"
        "401":
          $ref: "#/components/responses/Loi401"
        "403":
          $ref: "#/components/responses/Loi403"
        "422":
          $ref: "#/components/responses/Loi422"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Chỉ nhận 10, 25, 50, 100. Giá trị khác rơi về 10.
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 10

    Q:
      name: q
      in: query
      description: Tìm theo các cột text của resource.
      schema:
        type: string

    SortBy:
      name: sort_by
      in: query
      description: Chỉ nhận cột trong whitelist của từng resource.
      schema:
        type: string
        default: id

    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

    TrangThaiLoc:
      name: trang_thai
      in: query
      description: Lọc theo trạng thái hoạt động.
      schema:
        type: boolean

    SoTinChiLoc:
      name: so_tin_chi
      in: query
      description: Lọc chính xác theo số tín chỉ.
      schema:
        type: integer
        minimum: 1
        maximum: 10

    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    ThanhCong:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thành công
        data:
          nullable: true

    PhanTrang:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
        links:
          type: object
          properties:
            first:
              type: string
              nullable: true
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
            last:
              type: string
              nullable: true

    Loi:
      type: object
      required: [success, message, ma_loi, errors]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Lớp học phần đã đầy.
        ma_loi:
          type: string
          nullable: true
          enum:
            - AUTH_INVALID
            - ACCOUNT_LOCKED
            - MUST_CHANGE_PASSWORD
            - FORBIDDEN
            - NOT_FOUND
            - UNAUTHENTICATED
            - TOO_MANY_REQUESTS
            - VALIDATION_ERROR
            - DUPLICATE_CODE
            - DUPLICATE_EMAIL
            - SEMESTER_CLOSED
            - SEMESTER_HAS_SECTIONS
            - DELETE_BLOCKED
            - SECTION_FULL
            - SECTION_NOT_OPEN
            - DUPLICATE_ENROLLMENT
            - DUPLICATE_SUBJECT_IN_SEMESTER
            - SCHEDULE_CONFLICT
            - OUTSIDE_REGISTRATION
            - STUDENT_INACTIVE
            - HAS_GRADE_OR_ATTENDANCE
            - GRADE_LOCKED
            - GRADE_INCOMPLETE
            - RESTORE_PARENT_DELETED
            - ATTENDANCE_EDIT_EXPIRED
            - WRONG_STUDY_YEAR
            - SEMESTER_TRANSITION_INVALID
            - SEMESTER_OVERLAP
            - SESSION_OUTSIDE_SEMESTER
            - SUBJECT_CHANGE_BLOCKED
            - SEMESTER_CHANGE_BLOCKED
            - UPLOAD_NOT_CONFIGURED
            - UPLOAD_FAILED
        errors:
          nullable: true
          oneOf:
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
            - type: "null"

    Option:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
        label:
          type: string

    OptionMonHoc:
      allOf:
        - $ref: "#/components/schemas/Option"
        - type: object
          required: [so_tin_chi]
          properties:
            so_tin_chi:
              type: integer
              minimum: 1
              maximum: 10

    OptionHocKy:
      allOf:
        - $ref: "#/components/schemas/Option"
        - type: object
          required: [trang_thai, nam_hoc, ky_thu]
          properties:
            trang_thai:
              type: string
              enum: [UPCOMING, ONGOING, CLOSED]
            nam_hoc:
              type: string
              example: "2026-2027"
            ky_thu:
              type: integer
              minimum: 1
              maximum: 3

    OptionPhongHoc:
      allOf:
        - $ref: "#/components/schemas/Option"
        - type: object
          required: [suc_chua]
          properties:
            suc_chua:
              type: integer

    OptionLopHocPhan:
      allOf:
        - $ref: "#/components/schemas/Option"
        - type: object
          required: [con_cho]
          properties:
            con_cho:
              type: integer
              minimum: 0
            nam_thu:
              type: integer
              minimum: 1
              maximum: 6
              nullable: true
              description: null = lớp phục vụ mọi năm (BR-23)

    OptionLopHanhChinh:
      allOf:
        - $ref: "#/components/schemas/Option"
        - type: object
          properties:
            khoa_hoc:
              type: string
              nullable: true
              description: Khóa (cohort), ví dụ K65 — không phải khoa/faculty
            nganh:
              type: string
              nullable: true

    NguoiDung:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: string
          nullable: true
          description: URL Cloudinary; null = hiển thị chữ cái đầu tên
        vai_tro:
          type: string
          enum: [ADMIN, GIANG_VIEN, SINH_VIEN]
        trang_thai:
          type: boolean
          description: false = tài khoản bị khóa (BR-02)
        must_change_password:
          type: boolean
        ho_so:
          nullable: true
          type: object

    DuLieuDangNhap:
      type: object
      required: [token, het_han_luc, nguoi_dung]
      properties:
        token:
          type: string
          example: 1|abc...
        het_han_luc:
          type: string
          example: "2026-10-28 10:00:00"
        nguoi_dung:
          $ref: "#/components/schemas/NguoiDung"

    # ---------- Lớp hành chính ----------
    LopHanhChinhRutGon:
      type: object
      required: [id, ma_lop, ten_lop]
      properties:
        id:
          type: integer
        ma_lop:
          type: string
        ten_lop:
          type: string

    LopHanhChinh:
      type: object
      required: [id, ma_lop, ten_lop, si_so, trang_thai, da_xoa]
      properties:
        id:
          type: integer
        ma_lop:
          type: string
          example: CNTT-K65-01
        ten_lop:
          type: string
          example: Công nghệ thông tin K65 - Lớp 01
        khoa_hoc:
          type: string
          nullable: true
          description: Khóa (cohort, năm nhập học), ví dụ K65 — không phải khoa/faculty (ADR-016)
        nganh:
          type: string
          nullable: true
          example: CNTT
        nam_nhap_hoc:
          type: integer
          nullable: true
          description: Dùng tính năm thứ của sinh viên
        si_so:
          type: integer
          description: Số sinh viên hiện tại, tính từ bảng sinh_vien
        trang_thai:
          type: boolean
        da_xoa:
          type: boolean
          description: Bản ghi đã xóa mềm — chỉ thấy ở thùng rác

    LopHanhChinhInput:
      type: object
      required: [ma_lop, ten_lop]
      properties:
        ma_lop:
          type: string
          maxLength: 20
        ten_lop:
          type: string
          maxLength: 255
        khoa_hoc:
          type: string
          maxLength: 20
          nullable: true
        nganh:
          type: string
          maxLength: 20
          nullable: true
        nam_nhap_hoc:
          type: integer
          minimum: 1900
          maximum: 2100
          nullable: true
        mo_ta:
          type: string
          nullable: true
        trang_thai:
          type: boolean

    # ---------- Sinh viên ----------
    SinhVien:
      type: object
      required: [id, ma_sv, ho_ten, trang_thai, da_xoa]
      properties:
        id:
          type: integer
        ma_sv:
          type: string
          example: "2100001"
        ho_ten:
          type: string
        ngay_sinh:
          type: string
          nullable: true
          example: "2005-03-12"
        gioi_tinh:
          type: boolean
          nullable: true
          description: true = Nam, false = Nữ
        email:
          type: string
          format: email
        so_dien_thoai:
          type: string
          nullable: true
        dia_chi:
          type: string
          nullable: true
        trang_thai:
          type: boolean
        lop_hanh_chinh:
          allOf:
            - $ref: "#/components/schemas/LopHanhChinhRutGon"
          nullable: true
        avatar_url:
          type: string
          nullable: true
        da_xoa:
          type: boolean

    SinhVienInput:
      type: object
      required: [ma_sv, ho_ten, email]
      properties:
        ma_sv:
          type: string
          maxLength: 50
        ho_ten:
          type: string
          maxLength: 255
        ngay_sinh:
          type: string
          nullable: true
        gioi_tinh:
          type: boolean
          nullable: true
        email:
          type: string
          format: email
        so_dien_thoai:
          type: string
          maxLength: 20
          nullable: true
        dia_chi:
          type: string
          nullable: true
        lop_hanh_chinh_id:
          type: integer
          nullable: true
        trang_thai:
          type: boolean

    SinhVienTaoMoi:
      allOf:
        - $ref: "#/components/schemas/SinhVien"
        - type: object
          required: [mat_khau_ban_dau]
          properties:
            mat_khau_ban_dau:
              type: string
              description: Chỉ trả đúng một lần khi tạo; người dùng phải đổi ở lần đăng nhập đầu

    # ---------- Giảng viên ----------
    GiangVien:
      type: object
      required: [id, ma_gv, ho_ten, email, trang_thai, da_xoa]
      properties:
        id:
          type: integer
        ma_gv:
          type: string
          example: GV0001
        ho_ten:
          type: string
        email:
          type: string
          format: email
        so_dien_thoai:
          type: string
          nullable: true
        chuyen_mon:
          type: string
          nullable: true
        trang_thai:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        da_xoa:
          type: boolean

    GiangVienInput:
      type: object
      required: [ma_gv, ho_ten, email]
      properties:
        ma_gv:
          type: string
          maxLength: 50
        ho_ten:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        so_dien_thoai:
          type: string
          maxLength: 20
          nullable: true
        chuyen_mon:
          type: string
          nullable: true
        trang_thai:
          type: boolean

    GiangVienTaoMoi:
      allOf:
        - $ref: "#/components/schemas/GiangVien"
        - type: object
          required: [mat_khau_ban_dau]
          properties:
            mat_khau_ban_dau:
              type: string

    # ---------- Môn học ----------
    MonHoc:
      type: object
      required: [id, ma_mon, ten_mon, so_tin_chi, trang_thai, da_xoa]
      properties:
        id:
          type: integer
        ma_mon:
          type: string
          example: INT2215
        ten_mon:
          type: string
        so_tin_chi:
          type: integer
          minimum: 1
          maximum: 10
        mo_ta:
          type: string
          nullable: true
        trang_thai:
          type: boolean
        da_xoa:
          type: boolean

    MonHocInput:
      type: object
      required: [ma_mon, ten_mon, so_tin_chi]
      properties:
        ma_mon:
          type: string
          maxLength: 20
        ten_mon:
          type: string
          maxLength: 255
        so_tin_chi:
          type: integer
          minimum: 1
          maximum: 10
        mo_ta:
          type: string
          nullable: true
        trang_thai:
          type: boolean

    # ---------- Học kỳ ----------
    HocKy:
      type: object
      required: [id, ma_hoc_ky, ten_hoc_ky, nam_hoc, ky_thu, trang_thai]
      properties:
        id:
          type: integer
        ma_hoc_ky:
          type: string
          example: "2026-1"
        ten_hoc_ky:
          type: string
        nam_hoc:
          type: string
          example: "2026-2027"
        ky_thu:
          type: integer
          minimum: 1
          maximum: 3
          description: 1, 2 hoặc 3 (học kỳ hè)
        ngay_bat_dau:
          type: string
          example: "2026-09-07"
        ngay_ket_thuc:
          type: string
          example: "2027-01-15"
        mo_dang_ky_luc:
          type: string
          example: "2026-08-01 08:00:00"
        dong_dang_ky_luc:
          type: string
          example: "2026-08-20 17:00:00"
        trang_thai:
          type: string
          enum: [UPCOMING, ONGOING, CLOSED]
        dang_mo_dang_ky:
          type: boolean
          description: Suy ra từ thời điểm hiện tại so với mo/dong_dang_ky_luc

    HocKyInput:
      type: object
      required: [ma_hoc_ky, ten_hoc_ky, nam_hoc, ky_thu, ngay_bat_dau, ngay_ket_thuc, mo_dang_ky_luc, dong_dang_ky_luc]
      properties:
        ma_hoc_ky:
          type: string
          maxLength: 20
        ten_hoc_ky:
          type: string
          maxLength: 255
        nam_hoc:
          type: string
          maxLength: 9
          example: "2026-2027"
        ky_thu:
          type: integer
          minimum: 1
          maximum: 3
        ngay_bat_dau:
          type: string
        ngay_ket_thuc:
          type: string
          description: Phải sau ngay_bat_dau
        mo_dang_ky_luc:
          type: string
        dong_dang_ky_luc:
          type: string
          description: Phải sau mo_dang_ky_luc và nằm trong khoảng ngày của kỳ (BR-25)

    # ---------- Phòng học ----------
    PhongHoc:
      type: object
      required: [id, ma_phong, ten_phong, suc_chua, trang_thai, da_xoa]
      properties:
        id:
          type: integer
        ma_phong:
          type: string
          example: A101
        ten_phong:
          type: string
        suc_chua:
          type: integer
          minimum: 1
        trang_thai:
          type: boolean
        da_xoa:
          type: boolean

    PhongHocInput:
      type: object
      required: [ma_phong, ten_phong, suc_chua]
      properties:
        ma_phong:
          type: string
          maxLength: 20
        ten_phong:
          type: string
          maxLength: 255
        suc_chua:
          type: integer
          minimum: 1
        trang_thai:
          type: boolean

    # ---------- Menu ----------
    Menu:
      type: object
      required: [id, ten, url, vi_tri, thu_tu, trang_thai]
      properties:
        id:
          type: integer
        ten:
          type: string
          maxLength: 100
        url:
          type: string
          description: Bắt đầu bằng `/`, `#` hoặc `http(s)://`
        vi_tri:
          type: string
          enum: [header, sidebar]
        nhom:
          type: string
          nullable: true
          description: Nhóm hiển thị, ví dụ "Đào tạo"
        vai_tro:
          type: [string, "null"]
          description: null = mọi vai trò
          enum: [ADMIN, GIANG_VIEN, SINH_VIEN, null]
        thu_tu:
          type: integer
          default: 0
        trang_thai:
          type: boolean

    MenuInput:
      type: object
      required: [ten, url, vi_tri]
      properties:
        ten:
          type: string
          maxLength: 100
        url:
          type: string
        vi_tri:
          type: string
          enum: [header, sidebar]
        nhom:
          type: string
          maxLength: 100
          nullable: true
        vai_tro:
          type: [string, "null"]
          enum: [ADMIN, GIANG_VIEN, SINH_VIEN, null]
        thu_tu:
          type: integer
          default: 0
        trang_thai:
          type: boolean

    # ---------- Cấu hình ----------
    CauHinh:
      type: object
      required: [khoa, gia_tri]
      properties:
        khoa:
          type: string
          example: diem.trong_so
        gia_tri:
          description: JSON tuỳ khoá — object, mảng hoặc số
        mo_ta:
          type: string
          nullable: true

    CauHinhInput:
      type: object
      description: |
        Object khoá → giá trị. Gửi khoá nào ghi khoá đó, không gửi thì giữ nguyên.
        `diem.bang_quy_doi` bị 422 nếu khoảng chồng lấn, không phủ kín 0–10, hoặc
        `chu` không thuộc A/B/C/D/F.
      additionalProperties: true
      example:
        diem.trong_so:
          chuyen_can: 0.25
          giua_ky: 0.25
          cuoi_ky: 0.5

    BanCauHinh:
      type: object
      description: |
        Toàn bộ cấu hình dạng khoá → giá trị, đúng hình dạng `docs/04-api-contract.md`
        mục 13 mô tả cho `GET /api/settings`. Khoá là chuỗi có dấu chấm
        (`diem.trong_so`), giá trị là object/mảng/số tuỳ khoá.
      additionalProperties: true
      example:
        diem.trong_so:
          chuyen_can: 0.25
          giua_ky: 0.25
          cuoi_ky: 0.5
        diem.bang_quy_doi:
          - { tu: 8.5, den: 10.0, chu: A, he_4: 4.0, dat: true }
          - { tu: 7.0, den: 8.49, chu: B, he_4: 3.0, dat: true }
          - { tu: 5.5, den: 6.99, chu: C, he_4: 2.0, dat: true }
          - { tu: 4.0, den: 5.49, chu: D, he_4: 1.0, dat: true }
          - { tu: 0.0, den: 3.99, chu: F, he_4: 0.0, dat: false }

    # ---------- Thao tác hàng loạt (BR-31) ----------
    BulkStatusInput:
      type: object
      required: [ids, trang_thai]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
        trang_thai:
          type: boolean

    BulkDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer

    BulkKetQua:
      type: object
      required: [thanh_cong, that_bai, chi_tiet]
      properties:
        thanh_cong:
          type: integer
        that_bai:
          type: integer
        chi_tiet:
          type: array
          items:
            type: object
            required: [id, ket_qua]
            properties:
              id:
                type: integer
              ket_qua:
                type: string
                enum: [THANH_CONG, THAT_BAI]
              ma_loi:
                type: string
                nullable: true
              message:
                type: string
                nullable: true

  responses:
    Loi401:
